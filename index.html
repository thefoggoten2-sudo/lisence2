<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="head_container">
      <h1 class="h1__head">Question 2/10</h1>
      <p class="head__p1">
        Which of the following is the term for surgical complications resulting
        from surgical sponges left inside the patient's body?
      </p>
    </div>
    <div class="quiz_container">
      <ul class="quiz__list">
        <li>
          <button class="Quiz__button">
            <span class="Label__span">A</span
            ><span class="Text__span">Gauze grievance disorder</span>
          </button>
        </li>
        <li>
          <button class="Quiz__button">
            <span class="Label__span">B</span
            ><span class="Text__span">Gauze grievance disorder</span>
          </button>
        </li>
        <li>
          <button class="Quiz__button">
            <span class="Label__span">C</span
            ><span class="Text__span">Gauze grievance disorder</span>
          </button>
        </li>
        <li>
          <button class="Quiz__button">
            <span class="Label__span">D</span
            ><span class="Text__span">Gauze grievance disorder</span>
          </button>
        </li>
      </ul>
    </div>
    <div class="ABCD_container">
      <div class="A__container"></div>
      <div class="B__container"></div>
      <div class="C__container"></div>
      <div class="D__container"></div>
    </div>
  </body>
</html>
